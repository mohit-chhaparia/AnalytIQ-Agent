name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Lint with ruff
        run: ruff check agents/ tests/

      - name: Run tests
        env:
          # All LLM keys intentionally blank — tests must handle keyless mode
          ANTHROPIC_API_KEY: ""
          GEMINI_API_KEY: ""
          GROQ_API_KEY: ""
          LLM_BACKEND: "none"
        run: |
          python -m pytest tests/ -v --tb=short --color=yes

      - name: Import health check
        run: |
          python -c "from agents import StatisticalAnalysisAgent; print('✓ StatisticalAnalysisAgent')"
          python -c "from agents import profile_dataframe; print('✓ profile_dataframe')"
          python -c "from agents import recommend_models; print('✓ recommend_models')"
          python -c "from agents import run_linear_regression; print('✓ run_linear_regression')"
          python -c "from agents import run_logistic_regression; print('✓ run_logistic_regression')"
          python -c "from agents import run_poisson_regression; print('✓ run_poisson_regression')"
